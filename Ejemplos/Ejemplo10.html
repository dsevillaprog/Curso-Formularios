<!doctype html>
<html lang="es-ES">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <link rel="stylesheet" href="css/bootstrap.css">
  <link rel="icon" type="image/x-icon" href="../img/logo-js.png">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
  <title>Curso-JS | Carrusel en Bootstrap5.</title>
  <style>
    h3, .boton {
      color: black !important;
      font-weight: bold !important;
    }
    .boton:hover {
      background-color: rgb(243, 243, 243) !important;
    }
  </style>
  <link rel="icon" type="image/x-icon" href="../img/logo-js.png">
</head>

<body>
  <div class="container">
    <div id="carrusel01" class="carousel slide" data-bs-ride="carousel">

      <!-- Indicadores -->
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#carrusel01" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#carrusel01" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#carrusel01" data-bs-slide-to="2"></button>
        <button type="button" data-bs-target="#carrusel01" data-bs-slide-to="3"></button>
      </div>

      <!-- Fotos -->
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="../img/victus.jpg" alt="Victus PC" class="d-block w-100">
          <div class="carousel-caption">
            <h3>Victus PC</h3>
          </div>
        </div>

        <div class="carousel-item">
          <img src="../img/iphone.jpg" alt="Iphone 16" class="d-block w-100">
          <div class="carousel-caption">
            <br>
            <h3>Iphone 16</h3>
          </div>
        </div>
        <div class="carousel-item">
          <img src="../img/tablet.jpg" alt="Tablet LENOVO" class="d-block w-100">
          <div class="carousel-caption">
            <br>
            <h3>Tablet LENOVO</h3>
          </div>
        </div>
        <div class="carousel-item">
          <img src="../img/iphone.jpg" alt="Iphone 16" class="d-block w-100">
          <div class="carousel-caption">
            <br>
            <h3>Iphone 16</h3>
          </div>
        </div>
      </div>

      <!-- Botones izquierda y derecha -->
      <button class="carousel-control-prev boton" type="button" data-bs-target="#carrusel01" data-bs-slide="prev">
        <span class="carousel-control-prev-icon boton"></span>
      </button>
      <button class="carousel-control-next boton" type="button" data-bs-target="#carrusel01" data-bs-slide="next">
        <span class="carousel-control-next-icon boton"></span>
      </button>
    </div>

  </div>
</body>

</html>

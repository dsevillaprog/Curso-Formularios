<!DOCTYPE html>
<html lang="es-ES">

<head>
  <meta charset="UTF-8">
  <title>Curso-JS | Ejemplo 4</title>
  <meta name="author" content="𝓓𝓢𝓮𝓿𝓲𝓵𝓵𝓪𝓟𝓻𝓸𝓰 © ">
  <meta name="artist" content="ᗪᔕᵉᵛⁱˡˡᵃᑭʳᵒᵍ">
  <meta name="url" content="https://github.com/dsevillaprog">
  <meta name="instrument" content="🄱 🄰 🅂 🄷 + 🄷 🆃 🄼 🅻  & 🄲 🆂 🅂 ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/bootstrap.css">
  <link rel="icon" type="image/x-icon" href="../img/logo-js.png">
  <style>
    .redondeo {
      background-color: steelblue;
      border-radius: 0 5px 0 5px;
    }
  </style>
</head>

<body>
  <div class="container redondeo">
    <h1>Imágenes en Boostrap</h1>

    <div class="row">
      Sin clase adicional
      <div class="col-xl-12">
        <img src="img/img.png" alt="Plaza de España, Madrid" width="400">
      </div>
    </div>

    <div class="row">
      rounded
      <div class="col-xl-12">
        <img src="img/img.png" alt="Plaza de España, Madrid" width="400" class="rounded">
      </div>
    </div>

    <div class="row">
      rounded-circle
      <div class="col-xl-12">
        <img src="img/img.png" alt="Plaza de España, Madrid" width="400" class="rounded-circle">
      </div>
    </div>

    <div class="row">
      img-thumbnail
      <div class="col-xl-12">
        <img src="img/img.png" alt="Plaza de España, Madrid" width="400" class="img-thumbnail">
      </div>
    </div>

    <div class="row">
      float-start
      <div class="col-xl-12">
        <img src="img/img.png" alt="Plaza de España, Madrid" width="400" class="float-start">
      </div>
    </div>

    <div class="row">
      float-end
      <div class="col-xl-12">
        <img src="img/img.png" alt="Plaza de España, Madrid" width="400" class="float-end">
      </div>
    </div>

    <div class="row">
      centrada (mx-auto d-block)
      <div class="col-xl-12">
        <img src="img/img.png" alt="Plaza de España, Madrid" width="400" class="mx-auto d-block">
      </div>
    </div>

    <div class="row">
      <!-- fluid: más usada, se ajusta al div -->
      fluid
      <div class="col-xl-12">
        <img src="img/img.png" alt="Plaza de España, Madrid" class="img-fluid">
      </div>
    </div>

  </div>
</body>

</html>
